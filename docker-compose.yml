services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=data/synthetic
      # Uncomment for local Ollama:
      # - LLM_PROVIDER=ollama
      # - OLLAMA_HOST=http://brethren:11434
      # Uncomment for Cursor SDK:
      # - LLM_PROVIDER=cursor
      # - CURSOR_API_KEY=${CURSOR_API_KEY}
    volumes:
      # Mount local artifacts so Docker re-uses trained models without rebuilding
      - ./models/artifacts:/app/models/artifacts
      - ./index/store:/app/index/store
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ui:
    build: .
    command: streamlit run serving/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./models/artifacts:/app/models/artifacts
      - ./index/store:/app/index/store
      - ./data:/app/data
